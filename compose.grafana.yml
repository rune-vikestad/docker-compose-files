services:
  grafana:
    container_name: grafana
    restart: unless-stopped
    hostname: grafana
    profiles: 
      - grafana
    build:
      context: ./grafana
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  grafana-loki:
    container_name: grafana-loki
    restart: unless-stopped
    hostname: grafana-loki
    profiles: 
      - grafana
      - grafana-loki
    build:
      context: ./grafana-loki
      dockerfile: Dockerfile
    ports:
      - 3100:3100
    networks:
      - default

  grafana-mimir:
    container_name: grafana-mimir
    restart: unless-stopped
    hostname: grafana-mimir
    profiles: 
      - grafana
      - grafana-mimir
    build:
      context: ./grafana-mimir
      dockerfile: Dockerfile
    networks:
      - default

  grafana-tempo:
    container_name: grafana-tempo
    restart: unless-stopped
    hostname: grafana-tempo
    profiles: 
      - grafana
      - grafana-tempo
    build:
      context: ./grafana-tempo
      dockerfile: Dockerfile
    volumes:
      - grafana-tempo-data:/var/tempo
    networks:
      - default

volumes:
  grafana-tempo-data:
