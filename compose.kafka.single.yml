services:
  kafka:
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    build:
      context: ./kafka
      dockerfile: Dockerfile
    profiles: 
      - kafka
    environment:
      KAFKA_NODE_ID: 0
      # Read by the image to format storage (not KAFKA_CLUSTER_ID). Must be a 22-char base64url
      # Kafka Uuid, and must not change while the data volume exists.
      CLUSTER_ID: bi1jLkvfe2d__UIOcg8nzw
      KAFKA_PROCESS_ROLES: controller,broker
      # Listeners:
      # - CONTROLLER: KRaft quorum traffic
      # - BROKER: internal listener for in-docker clients/metadata
      # - EXTERNAL: host-facing listener for host apps/CLIs
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,BROKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      # Internal advertises the Docker hostname; external advertises your host address/port
      # Use 127.0.0.1 if clients run on the same machine; otherwise use your machine's LAN IP
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://127.0.0.1:19092
      # Map listener names to protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Inter-broker comms should use the internal listener
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      # KRaft controller settings (single voter = self)
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Internal topics default to RF=3, which a single broker cannot satisfy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Partition data and KRaft metadata, persisted in the volume below
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - 19092:19092
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/9092 && exec 3>&- 3<&-"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s  
    networks: 
      - default

  kafka-bootstrap:
    container_name: kafka-bootstrap
    hostname: kafka-bootstrap
    # Capped, so a missing schema registry fails visibly instead of restarting forever
    restart: on-failure:3
    profiles:
      - kafka
      - kafka-bootstrap
    depends_on:
      kafka:
        condition: service_healthy
      # Not required, so the stack still starts with the apicurio profile disabled
      apicurio-registry:
        condition: service_healthy
        required: false
    build:
      context: ./kafka-bootstrap
      dockerfile: Dockerfile
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://apicurio-registry:8080/apis/ccompat/v7
      DEFAULT_PARTITIONS: 1
      DEFAULT_REPLICATION_FACTOR: 1
      WAIT_MAX_TRIES: 60
    networks:
      - default

  kafka-ui:
    container_name: kafka-ui
    hostname: kafka-ui
    profiles: 
      - kafka-ui
    build:
      context: ./kafka-ui
      dockerfile: Dockerfile
    environment:
      KAFKA_CLUSTERS_0_NAME: Default
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio-registry:8080/apis/ccompat/v7
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - 8092:8080
    networks: 
      - default

volumes:
  kafka-data:
