name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR makes the previous run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: 44.149.0

jobs:
  compose-config:
    name: Validate compose files
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Default stack (.env, single-node Kafka)
        run: docker compose config --quiet

      - name: Kafka cluster variant
        run: docker compose -f compose.yml -f compose.apicurio.yml -f compose.postgresql.yml -f compose.kafka.cluster.yml config --quiet

  shellcheck:
    name: ShellCheck entrypoint scripts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          shellcheck --version
          find . -path ./.git -prune -o -name '*.sh' -type f -print0 | xargs -0 shellcheck

  renovate-config:
    name: Validate renovate.json
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run Renovate config validator
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  build:
    name: Build images
    runs-on: ubuntu-26.04
    needs: compose-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds every service with a build context in the profiles enabled by .env
      - name: Build all images
        run: docker compose build
