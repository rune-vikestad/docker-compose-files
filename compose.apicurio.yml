services:
  apicurio-registry:
    container_name: apicurio-registry
    hostname: apicurio-registry
    restart: unless-stopped
    profiles:
      - apicurio
      - apicurio-registry
    depends_on:
      postgresql:
        condition: service_healthy
    build:
      context: ./apicurio-registry
      dockerfile: Dockerfile
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgresql/apicurio
      APICURIO_DATASOURCE_USERNAME: svc_apicurio_registry
      APICURIO_DATASOURCE_PASSWORD: 1wg45TrZCioqXghDDh3PhdiQe5KU4Yq7
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:8888"
      QUARKUS_HTTP_CORS_METHODS: "GET,PUT,POST,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_HEADERS: "Authorization,Content-Type,Accept,Origin"
    healthcheck:
      test: ["CMD-SHELL","curl -fsS http://localhost:8080/apis/registry/v2/search/artifacts?limit=1 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - 8080:8080
    networks:
      - default

  apicurio-registry-bootstrap:
    container_name: apicurio-registry-bootstrap
    hostname: apicurio-registry-bootstrap
    restart: on-failure
    profiles:
      - apicurio
      - apicurio-registry
      - apicurio-registry-bootstrap
    depends_on:
      apicurio-registry:
        condition: service_healthy
    build:
      context: ./apicurio-registry-bootstrap
      dockerfile: Dockerfile
    environment:
      REGISTRY_URL: http://apicurio-registry:8080/apis/registry/v3
      REGISTRY_FALLBACK_GROUP: default
      SCHEMA_DIR: /usr/local/share/apicurio/schemas
      LOG_FAILED_HTTP_RESPONSE_HEADERS: true
      LOG_FAILED_HTTP_RESPONSE_BODY: true
    networks:
      - default

  apicurio-registry-ui:
    container_name: apicurio-registry-ui
    hostname: apicurio-registry-ui
    restart: unless-stopped
    profiles:
      - apicurio
      - apicurio-registry-ui
    depends_on:
      apicurio-registry:
        condition: service_healthy
    build:
      context: ./apicurio-registry-ui
      dockerfile: Dockerfile
    environment:
      REGISTRY_API_URL: http://localhost:8080/apis/registry/v3
    ports:
      - "8888:8080"
    networks:
      - default