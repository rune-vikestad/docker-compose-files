services:
  kafka-controller:
    container_name: kafka-controller
    hostname: kafka-controller
    restart: unless-stopped
    build:
      context: ./kafka
      dockerfile: Dockerfile
    profiles:
      - kafka
    environment:
      KAFKA_NODE_ID: 0
      # Read by the image to format storage (not KAFKA_CLUSTER_ID). Must be a 22-char base64url
      # Kafka Uuid, identical on every node, and must not change while the data volumes exist.
      CLUSTER_ID: bi1jLkvfe2d__UIOcg8nzw
      KAFKA_PROCESS_ROLES: controller
      # Listen for controller quorum traffic
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-controller:9093
      # KRaft metadata, persisted in the volume below
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-controller-data:/var/lib/kafka/data
    ports:
      - 9093:9093
    healthcheck:
      # Check if the TCP port 9093 is open and ready to accept connections
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/9093 && exec 3>&- 3<&-"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - default

  kafka-broker-1:
    container_name: kafka-broker-1
    hostname: kafka-broker-1
    restart: unless-stopped
    build:
      context: ./kafka
      dockerfile: Dockerfile
    profiles:
      - kafka
    depends_on:
      kafka-controller:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 1
      # Read by the image to format storage (not KAFKA_CLUSTER_ID). Must be a 22-char base64url
      # Kafka Uuid, identical on every node, and must not change while the data volumes exist.
      CLUSTER_ID: bi1jLkvfe2d__UIOcg8nzw
      KAFKA_PROCESS_ROLES: broker
      # Two listeners: internal (BROKER) and host-facing (EXTERNAL)
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094
      # Internal advertises the Docker hostname, external advertises your host address/ports
      # Use 127.0.0.1 if clients run on the same machine; otherwise use your machine's LAN IP
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka-broker-1:9092,EXTERNAL://127.0.0.1:19094
      # Map listener names to protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Make inter-broker comms use the internal listener
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      # KRaft controller settings
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-controller:9093
      # Internal topics default to RF=3, which two brokers cannot satisfy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Partition data and KRaft metadata, persisted in the volume below
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    ports:
      # Publish only the EXTERNAL listener to host. Keep 9092 internal to Docker network.
      - 19094:19094
    healthcheck:
      # Check if the TCP port 9092 is open and ready to accept connections
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/9092 && exec 3>&- 3<&-"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - default

  kafka-broker-2:
    container_name: kafka-broker-2
    hostname: kafka-broker-2
    restart: unless-stopped
    build:
      context: ./kafka
      dockerfile: Dockerfile
    profiles:
      - kafka
    depends_on:
      kafka-controller:
        condition: service_healthy
    environment:
      KAFKA_NODE_ID: 2
      # Read by the image to format storage (not KAFKA_CLUSTER_ID). Must be a 22-char base64url
      # Kafka Uuid, identical on every node, and must not change while the data volumes exist.
      CLUSTER_ID: bi1jLkvfe2d__UIOcg8nzw
      KAFKA_PROCESS_ROLES: broker
      # Two listeners: internal (BROKER) and host-facing (EXTERNAL)
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,EXTERNAL://0.0.0.0:19095
      # Internal advertises the Docker hostname, external advertises your host address/ports
      # Use 127.0.0.1 if clients run on the same machine; otherwise use your machine's LAN IP
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka-broker-2:9092,EXTERNAL://127.0.0.1:19095
      # Map listener names to protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Make inter-broker comms use the internal listener
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      # KRaft controller settings
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka-controller:9093
      # Internal topics default to RF=3, which two brokers cannot satisfy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Partition data and KRaft metadata, persisted in the volume below
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-broker-2-data:/var/lib/kafka/data
    ports:
      # Publish only the EXTERNAL listener to host. Keep 9092 internal to Docker network.
      - 19095:19095
    healthcheck:
      # Check if the TCP port 9092 is open and ready to accept connections
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/9092 && exec 3>&- 3<&-"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - default

  kafka-bootstrap:
    container_name: kafka-bootstrap
    hostname: kafka-bootstrap
    # Capped, so a missing schema registry fails visibly instead of restarting forever
    restart: on-failure:3
    profiles:
      - kafka
      - kafka-bootstrap
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      # Not required, so the stack still starts with the apicurio profile disabled
      apicurio-registry:
        condition: service_healthy
        required: false
    build:
      context: ./kafka-bootstrap
      dockerfile: Dockerfile
    environment:
      BOOTSTRAP_SERVERS: kafka-broker-1:9092,kafka-broker-2:9092
      SCHEMA_REGISTRY_URL: http://apicurio-registry:8080/apis/ccompat/v7
      DEFAULT_PARTITIONS: 1
      DEFAULT_REPLICATION_FACTOR: 2
      WAIT_MAX_TRIES: 60
    networks:
      - default

  kafka-ui:
    container_name: kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    profiles:
      - kafka-ui
    depends_on:
      kafka-controller:
        condition: service_healthy
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
    build:
      context: ./kafka-ui
      dockerfile: Dockerfile
    environment:
      KAFKA_CLUSTERS_0_NAME: Default
      # Stays on internal addresses since Kafka UI is in the same Docker network
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:9092,kafka-broker-2:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio-registry:8080/apis/ccompat/v7
    ports:
      - 8092:8080
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default

volumes:
  kafka-controller-data:
  kafka-broker-1-data:
  kafka-broker-2-data:
